name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Use Node.js 20.x
      uses: actions/setup-node@v3
      with:
        node-version: 20.x
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Build for production
      run: npm run build
    
    - name: Create Release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref }}
        release_name: Release ${{ github.ref }}
        body: |
          ## DSH-IDE Release ${{ github.ref }}
          
          ### 功能特性
          - 多标签页编辑器
          - 文件资源管理器
          - 集成终端
          - 命令面板
          - 快速打开
          - 编辑器分屏
          
          ### 安装方法
          1. 克隆仓库
          2. 安装依赖：npm install
          3. 启动项目：npm run dev
          
          ### 技术栈
          - React 18 + TypeScript
          - Monaco Editor
          - xterm.js
          - Zustand
          - Tailwind CSS
          - Vite 5
        draft: false
        prerelease: false
    
    - name: Upload Release Asset
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ./dist
        asset_name: dsh-ide-${{ github.ref }}.zip
        asset_content_type: application/zip
